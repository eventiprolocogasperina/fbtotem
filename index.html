<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Totem Ordini Birra Festival</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h1>Totem FestivalBeer</h1>

    <div class="products-section">
        <h2>Le Nostre Bevande</h2>
        <div id="product-list" class="product-list">
            <!-- Prodotti caricati via JavaScript -->
        </div>
    </div>

    <div class="order-section">
        <h2>Il Tuo Ordine</h2>
        <ul id="order-summary" class="order-summary">
            <!-- Gli articoli compariranno qui -->
        </ul>
        <div class="total-section">
            <span>Totale:</span>
            <span id="order-total">€0.00</span>
        </div>
        <div class="payment-section">
            <h3>Metodo di Pagamento</h3>
            <div id="payment-method-buttons">
                <button class="payment-btn" data-method="Contanti">Contanti</button>
                <button class="payment-btn" data-method="Carta">Carta</button>
                <button class="payment-btn" data-method="Mobile Pay">Mobile Pay</button>
            </div>
            <button id="place-order-btn">Conferma Ordine</button>
        </div>
    </div>

    <div class="history-section">
        <h2>Cronologia Acquisti</h2>
        <ul id="purchase-history" class="purchase-history">
            <!-- Cronologia caricata qui -->
        </ul>
        <button id="clear-history-btn">Svuota Cronologia</button>
        <button id="export-csv-btn">Esporta in CSV</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
